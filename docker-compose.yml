version: "2"

services:
  tegola:
    image: debian:stable-slim
    network_mode: service:net
    working_dir: /src
    entrypoint: /bin/sh -c "/src/generate_config.sh && /src/tegola serve --config /src/config.toml"
    volumes:
      - ".:/src" # for tegola binary and config.toml

  db:
    image: postgis/postgis:11-2.5
    network_mode: service:net
    environment:
      POSTGRES_DBNAME: osm
      POSTGRES_USER: osm
      POSTGRES_PASSWORD: osm
    volumes:
      - ".:/src:ro"
      - "/var/lib/postgresql"

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:6.8.9
    network_mode: service:net
    environment:
      discovery.type: single-node
      http.port: 9500
    volumes:
      - "/usr/share/elasticsearch/data"

  graphhopper:
    image: graphhopper/graphhopper:latest # Using latest, consider pinning to a specific version
    network_mode: service:net
    environment:
      # Set Java options for memory allocation. Adjust -Xmx and -Xms as needed.
      # GH_JAVA_OPTS: "-Xmx1g -Xms1g" # Default is 1g, this is just an example
      # The image's default CMD will import *.osm.pbf from /data
      # Ensure the PBF file is in the root of the mounted /data volume
      # Or explicitly set graph.location if needed:
      # GH_GRAPH_LOCATION: "/data/osm.pbf"
      # Using RAM_STORE for graph.dataaccess for faster startup with smaller graphs
      # GH_GRAPH_DATAACCESS: "RAM_STORE" # Default is MMAP
    volumes:
      - "./data/lithuania-latest.osm.pbf:/data/osm.pbf:ro" # Mount the PBF file to /data/osm.pbf
      - "./graphhopper_cache:/graphhopper/graph-cache" # Persist graph cache

  web:
    image: nginx:stable
    network_mode: service:net
    volumes:
      - ".:/src:ro"
      - "./nginx.conf:/etc/nginx/conf.d/openmap.conf:ro"

  maputnik:
    image: maputnik/editor:latest
    network_mode: service:net

  net:
    image: debian:stable-slim
    entrypoint: ["tail", "-f", "/dev/null"]
    ports:
      - "5432:5432" # postgresql
      - "8080:8080" # web -- nginx
      - "8888:8888" # maputnik
      - "9500:9500" # elastic
      - "8989:8989" # graphhopper
